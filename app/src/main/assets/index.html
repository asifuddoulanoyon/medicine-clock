<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ঔষধের ঘড়ি · Medicine Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-column phone app. Setup and "add medicine" are full-screen step-by-step wizards with a fixed Back/Next bar; alarms take over the whole screen */
  --paper:#eef3ee; --card:#ffffff; --ink:#123330; --muted:#5a706c; --line:#d3ded8;
  --leaf:#1d7457; --leaf-soft:#d8ece2; --pill:#f0b429; --pill-soft:#fdf1d2;
  --alert:#c8412c; --alert-soft:#fbe2dc; --ok:#2e8b57;
  --display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1a19; --card:#172625; --ink:#e4efeb; --muted:#9db3ad; --line:#2a3d3b;
  --leaf:#4cbf91; --leaf-soft:#1c3a31; --pill:#f5c451; --pill-soft:#3a3120;
  --alert:#ff7a63; --alert-soft:#3d221d; --ok:#5fcf8d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1a19; --card:#172625; --ink:#e4efeb; --muted:#9db3ad; --line:#2a3d3b;
  --leaf:#4cbf91; --leaf-soft:#1c3a31; --pill:#f5c451; --pill-soft:#3a3120;
  --alert:#ff7a63; --alert-soft:#3d221d; --ok:#5fcf8d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pill);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;flex:none}
.top h1{font-size:23px;font-weight:800}
.top .sub{font-size:13px;color:var(--muted);margin-top:-2px}
.top .grow{flex:1;min-width:0}
.lang{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px}
main{flex:1;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--leaf);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--leaf);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--alert)}
.btn.pill{background:var(--pill);color:#2b2000}
.btn.big{font-size:20px;padding:16px 22px;border-radius:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.inp{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink);font-weight:400;width:100%}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--card);padding:10px 6px;font-size:15px;min-width:80px}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff;font-weight:700}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner.info{background:var(--leaf-soft)}
.banner.warn{background:var(--pill-soft)}
.banner.danger{background:var(--alert-soft)}
.banner b{display:block}
.banner .ic{flex:none;width:22px;height:22px;margin-top:2px}
.next{background:var(--leaf);color:#fff;border:0}
.next .when{font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.next .lbl{opacity:.85;font-size:14px}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--pill-soft);display:grid;place-items:center;color:var(--leaf)}
.thumb svg{width:30px;height:30px}
.dose{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-child{border-top:0}
.dose .nm{font-weight:700}
.dose .meta{font-size:14px;color:var(--muted)}
.grow{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.tag.taken{background:var(--leaf-soft);color:var(--ok)}
.tag.due{background:var(--pill);color:#2b2000}
.tag.missed{background:var(--alert-soft);color:var(--alert)}
.tag.up,.tag.who{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tag.skip{background:var(--paper);color:var(--muted)}
.slot h3{font-size:18px}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:8px;margin-bottom:4px;background:var(--line);position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--leaf)}
.medrow{display:flex;gap:12px;align-items:center}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink)}
.tr{display:flex;gap:8px;align-items:center}
.tr input[type=time]{flex:1}
/* Wizard */
.wiz-head{display:flex;flex-direction:column;gap:8px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--leaf)}
.wiz-head .stepno{font-size:14px;color:var(--muted);font-weight:600}
.wiz-head h2{font-size:26px}
.wiz-nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.wiz-nav .in{display:flex;gap:10px;max-width:528px;width:100%}
.wiz-nav .btn{flex:1;font-size:18px;padding:14px}
.wiz-nav .btn.ghost{flex:0 0 auto;min-width:96px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tiles.three{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.tile{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:16px;line-height:1.25}
.tile svg{width:38px;height:38px;color:var(--leaf)}
.tile small{font-weight:400;color:var(--muted);font-size:13px}
.tile[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.mealtile{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mealtile.on{border-color:var(--leaf);background:var(--leaf-soft)}
.mealtile .hd{display:flex;align-items:center;gap:10px}
.mealtile .hd button{flex:1;text-align:left;background:none;border:0;padding:0;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--card)}
.on .box{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;line-height:1}
.stepper input{width:70px;text-align:center;padding:8px 4px}
.sum{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:start}
.sum dt{color:var(--muted);font-size:14px;font-weight:600;padding-top:2px}
.sum dd{margin:0;font-weight:600}
.sum .ed{font-size:13px;padding:4px 10px}
.photo-drop{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.photo-drop img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.hidden{display:none!important}
.hero{background:linear-gradient(135deg,var(--pill-soft),var(--leaf-soft));border:0}
.rv.off{opacity:.55}
/* Alarm */
.alarm{position:fixed;inset:0;z-index:50;background:var(--alert);color:#fff;display:flex;flex-direction:column;padding:22px 18px calc(22px + env(safe-area-inset-bottom));overflow:auto}
.alarm .ring{width:80px;height:80px;margin:4px auto 6px;animation:shake .5s infinite;flex:none}
@media (prefers-reduced-motion:reduce){.alarm .ring{animation:none}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.alarm h2{font-size:32px;text-align:center}
.alarm .clock{text-align:center;font-family:var(--display);font-size:21px;opacity:.92}
.alarm .count{text-align:center;margin-top:6px;font-size:18px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;align-self:center}
.alarm .list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.alarm .am{background:rgba(255,255,255,.14);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.alarm .am img,.alarm .am .thumb{width:70px;height:70px;border-radius:14px}
.alarm .am .no{font-family:var(--display);font-size:28px;font-weight:800;width:28px;text-align:center;flex:none}
.alarm .am .nm{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1}
.alarm .am .meta{font-size:16px}
.alarm .first{background:#fff;color:var(--alert);border-radius:14px;padding:12px;font-weight:700}
.alarm .acts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.alarm .btn{background:#fff;color:var(--alert);font-size:22px;padding:18px}
.alarm .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);font-size:18px;padding:14px}
/* Big-button mode */
.big .who{font-family:var(--display);font-size:30px;font-weight:800;text-align:center}
.big .bigmed{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.big .bigmed img,.big .bigmed .thumb{width:160px;height:160px;border-radius:24px}
.big .bigmed .thumb svg{width:84px;height:84px}
.big .bigmed .nm{font-family:var(--display);font-size:32px;font-weight:800;line-height:1.05}
.big .bigmed .meta{font-size:21px}
.big .btn.big{font-size:28px;padding:22px;border-radius:20px}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90%;text-align:center}
.spin{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--leaf);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--leaf)"/><rect x="9" y="15" width="22" height="10" rx="5" fill="var(--pill)" transform="rotate(-35 20 20)"/><rect x="9" y="15" width="11" height="10" rx="5" fill="#fff" transform="rotate(-35 20 20)"/><circle cx="20" cy="20" r="2" fill="var(--ink)"/></svg>
    <div class="grow"><h1 id="appname">ঔষধের ঘড়ি</h1><div class="sub" id="today-date"></div></div>
    <button class="lang" id="langbtn" data-act="lang">English</button>
  </header>
  <div id="unlock" class="hidden" style="padding:10px 16px 0"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs"><div class="in" id="tabs-in"></div></nav>
  <div class="wiz-nav hidden" id="wiznav"><div class="in" id="wiznav-in"></div></div>
</div>
<div id="alarm" class="alarm hidden" role="alertdialog" aria-modal="true"></div>
<input type="file" id="file-photo" accept="image/*" capture="environment" class="hidden">
<input type="file" id="file-rx" accept="image/*" multiple class="hidden">
<input type="file" id="file-audio" accept="audio/*" capture="user" class="hidden">

<script>
"use strict";
/* ============ Basics ============ */

const num = x => S.lang === "bn" ? String(x).replace(/\d/g, d => BN[d]) : String(x);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");

const fromMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const dateLabel = (ds, o = {day:"numeric", month:"short"}) => new Date(ds + "T00:00").toLocaleDateString(S.lang === "bn" ? "bn-BD" : "en-GB", o);
function fmtTime(t){
  const [h, m] = t.split(":").map(Number), h12 = ((h + 11) % 12) + 1;
  if (S.lang === "bn"){ const p = h < 4 ? "রাত" : h < 12 ? "সকাল" : h < 16 ? "দুপুর" : h < 18 ? "বিকাল" : h < 20 ? "সন্ধ্যা" : "রাত"; return `${p} ${num(h12)}:${num(pad(m))}`; }
  return `${h12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`;
}
function durText(min){
  min = Math.abs(min);
  if (min < 60) return T(`${min} min`, `${num(min)} মিনিট`);
  const h = min / 60;
  return Number.isInteger(h) ? T(`${h} hour${h > 1 ? "s" : ""}`, `${num(h)} ঘণ্টা`) : T(`${Math.floor(h)} h ${min%60} min`, `${num(Math.floor(h))} ঘণ্টা ${num(min%60)} মিনিট`);
}

/* ============ Reference lists ============ */
const RELS = [["me","Myself","নিজে"],["father","Father","আব্বা"],["mother","Mother","আম্মা"],["husband","Husband","স্বামী"],["wife","Wife","স্ত্রী"],["gfather","Grandfather","দাদা / নানা"],["gmother","Grandmother","দাদি / নানি"],["child","Child","সন্তান"],["other","Someone else","অন্য কেউ"]];
const DISEASES = [["diabetes","Diabetes","ডায়াবেটিস"],["bp","High blood pressure","উচ্চ রক্তচাপ"],["gastric","Gastric / ulcer","গ্যাস্ট্রিক / আলসার"],["heart","Heart disease","হৃদরোগ"],["thyroid","Thyroid","থাইরয়েড"],["asthma","Asthma / breathing","হাঁপানি / শ্বাসকষ্ট"],["pain","Arthritis / joint pain","বাত / জয়েন্টে ব্যথা"],["sleep","Sleep problem","ঘুমের সমস্যা"],["chol","Cholesterol","কোলেস্টেরল"],["kidney","Kidney disease","কিডনি রোগ"],["liver","Liver disease","লিভারের রোগ"],["eye","Eye problem","চোখের সমস্যা"],["skin","Skin problem","চর্মরোগ"],["mental","Anxiety / depression","দুশ্চিন্তা / বিষণ্ণতা"],["preg","Pregnancy","গর্ভাবস্থা"]];
const CATS = [["other","Other / general","অন্যান্য"],["nsaid","Painkiller (NSAID)","ব্যথানাশক (NSAID)"],["para","Paracetamol (fever/pain)","প্যারাসিটামল (জ্বর/ব্যথা)"],["gastric","Gastric / acidity","গ্যাস্ট্রিকের ঔষধ"],["sleep","Sleeping pill","ঘুমের ঔষধ"],["diabetes","Diabetes","ডায়াবেটিসের ঔষধ"],["bp","Blood pressure","প্রেসারের ঔষধ"],["thyroid","Thyroid","থাইরয়েডের ঔষধ"],["antibiotic","Antibiotic","অ্যান্টিবায়োটিক"],["vitamin","Vitamin / calcium","ভিটামিন / ক্যালসিয়াম"]];
/* Forms: unit word, step size, whether it's counted for stock, default "where" */
const FORMS = {
  tablet:{en:"Tablet", bn:"ট্যাবলেট", uen:"tablet", ubn:"টি", say:"ট্যাবলেট", step:.5, count:true},
  capsule:{en:"Capsule", bn:"ক্যাপসুল", uen:"capsule", ubn:"টি", say:"ক্যাপসুল", step:1, count:true},
  syrup:{en:"Syrup / liquid", bn:"সিরাপ / তরল", uen:"spoon", ubn:"চামচ", say:"চামচ", step:.5},
  drop:{en:"Drops", bn:"ড্রপ (ফোঁটা)", uen:"drop", ubn:"ফোঁটা", say:"ফোঁটা", step:1, sites:["both_eyes","right_eye","left_eye","both_ears","right_ear","left_ear","nose","mouth"]},
  cream:{en:"Cream / ointment / paste / gel", bn:"মলম / ক্রিম / পেস্ট / জেল", uen:"time", ubn:"বার", say:"", step:1, sites:["skin","wound","mouth","gums","other"], noAmt:true},
  inhaler:{en:"Inhaler", bn:"ইনহেলার", uen:"puff", ubn:"চাপ", say:"চাপ", step:1, count:true},
  spray:{en:"Spray", bn:"স্প্রে", uen:"spray", ubn:"বার স্প্রে", say:"বার স্প্রে", step:1, sites:["nose","mouth","skin"]},
  insulin:{en:"Insulin", bn:"ইনসুলিন", uen:"unit", ubn:"ইউনিট", say:"ইউনিট", step:1},
  inj:{en:"Injection", bn:"ইনজেকশন", uen:"injection", ubn:"টি", say:"ইনজেকশন", step:1, count:true},
  powder:{en:"Powder / sachet", bn:"পাউডার / স্যাশে", uen:"sachet", ubn:"প্যাকেট", say:"প্যাকেট", step:.5, count:true},

function alarmParts(group, first){

let alarmGroup = null, snooze = {}, fired = new Set();
function checkAlarms(){
  if (alarmGroup || NAT) return;   // in the APK the phone itself rings the alarm
  const now = Date.now();
  const due = dosesFor(new Date()).filter(d => {
    if (S.log[d.id]) return false;
    const diff = nowMin() - toMin(d.t);
    if (diff < 0 || diff > 120) return false;
    if (snooze[d.id]) return now >= snooze[d.id];
    return !fired.has(d.id);
  });
  if (!due.length) return;
  const pid = due[0].med.profile;
  openAlarm(due.filter(d => d.med.profile === pid));
}

}

function buildEvents(){
  const out = [], now = Date.now();
  for (let off = 0; off < 14; off++){
    const day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() + off);
    const groups = {};
    dosesFor(day).filter(x => !S.log[x.id]).forEach(x => { const k = x.med.profile + "|" + x.t; (groups[k] = groups[k] || []).push(x); });
    for (const g of Object.values(groups)){
      const e = eventFor(g, day);
      if (e.at >= now - 30*60000) out.push(e);
    }
  }
  return out.sort((a, b) => a.at - b.at);
}

  if (view === "setup" && !setup) setup = newSetup(true);
  const fn = {welcome:vWelcome, setup:vSetup, home: S.bigMode ? vBig : vHome, meds:vMeds, people:vPeople, settings:vSettings, add:vAdd, wiz:vWiz, scan:vScan}[view] || vHome;

/* Ask Claude once how to say an English brand name in Bangla, so the voice reads it clearly */
async function guessPronunciation(m){
  if (S.lang !== "bn" || m.name_bn || !/[a-z]/i.test(m.name || "")) return;
  try {
    if (!SAMPLE && window.claude) SAMPLE = await claude.use("sample");
    if (!SAMPLE) return;
    const r = await SAMPLE(`Write how this medicine name is pronounced in Bangladesh, in Bangla script only, without the strength or numbers. Example: "Napa Extra 500mg" -> "নাপা এক্সট্রা". Name: "${m.name.replace(/"/g, "")}". Reply with only the Bangla words.`, {modelTier:"quick"});
    const t = (r && r.text || "").trim().split("\n")[0].replace(/["'.।]/g, "").slice(0, 40);
    if (t && /[\u0980-\u09FF]/.test(t) && !m.name_bn){ m.name_bn = t; if (view === "wiz" && wiz && wiz.m === m && wiz.step === 5) render(); }
  } catch(e){}
}

  return true;

function setMode(m, mode){
  const amt = (m.times[0] || {}).amt || 1;
  m.mode = mode;
  if (mode === "meal"){ m.times = []; if (!["before","after","with","empty"].includes(m.food)) m.food = "after"; }
  if (mode === "clock"){ m.times = [{t:"08:00", amt, custom:true}]; if (!["any","empty","after"].includes(m.food)) m.food = "any"; }
  if (mode === "interval"){ m.times = [{t:m.first, amt}]; m.food = "any"; m.times = intervalTimes(m); }
  if (mode === "sos"){ m.times = [{t:"00:00", amt}]; m.food = "any"; }

{"medicines":[{"name":"as written, with strength","name_bn":"brand name pronounced in Bangla script, no strength, e.g. 'নাপা', 'সেকলো'","form":"tablet|capsule|syrup|drop|cream|inhaler|spray|insulin|inj|powder|supp","site":"one of the sites or null","pattern":"e.g. 1+0+1 in western digits, or null","every_hours":number or null,"sos":boolean,"food":"before|after|with|empty|any","offset_minutes":number or null,"days":number or null,"freq":"daily|alt|weekly","category":"nsaid|para|gastric|sleep|diabetes|bp|thyroid|antibiotic|vitamin|other","unclear":boolean,"note":"short extra instruction, or empty"}]}

const loadImg = file => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
function scaleTo(img, max){ const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c; }
function rxToMed(x, pid){
  const m = newMed(pid);
  m.name = x.name || ""; m.name_bn = x.name_bn || "";
  m.form = FORMS[x.form] ? x.form : (detectForm(m.name) || "tablet");
  m.site = SITES[x.site] ? x.site : (m.form === "drop" ? "both_eyes" : "");
  m.cat = CATS.some(c => c[0] === x.category) && x.category !== "other" ? x.category : detectCat(m.name);
  m.food = FOOD[x.food] ? x.food : "after";
  m.offset = +x.offset_minutes || (m.food === "before" ? 30 : 0);
  m.note = x.note || "";
  m.freq = x.freq === "alt" ? "alt" : x.freq === "weekly" ? "week" : "daily";
  if (m.freq === "week") m.weekdays = [new Date().getDay()];
  if (x.sos){ setMode(m, "sos"); }
  else if (+x.every_hours){ m.every = +x.every_hours; setMode(m, "interval"); }
  else {
    m.mode = "meal";
    const parts = String(x.pattern || "1+0+1").replace(/[০-৯]/g, c => BN.indexOf(c)).replace(/½/g, "0.5").split(/[+\-]/).map(s => parseFloat(s) || 0);
    const slots = parts.length >= 4 ? ["b","l","d","bed"] : parts.length === 2 ? ["b","d"] : ["b","l","d"];
    parts.slice(0, 4).forEach((a, i) => { if (a > 0) m.times.push({slot:slots[i], amt:a, t:"00:00"}); });
    if (!m.times.length) m.times.push({slot:"b", amt:1, t:"00:00"});
    if (m.food === "any") m.food = "after";
    retime(m);
  }
  if (x.days) m.end = dkey(new Date(new Date(m.start + "T00:00").getTime() + (+x.days - 1) * 864e5));
  return {med:m, on:!x.sos || true, unclear:!!x.unclear};
}
async function scanFiles(files, pid){
  const keep = review && review.state === "review" ? review : null;
  view = "scan";
  review = {state:"loading", pid, done:0, total:files.length, imgs: keep ? keep.imgs : [], items: keep ? keep.items : [], failed:0};
  render();
  try {
    if (!SAMPLE && window.claude) SAMPLE = await claude.use("sample");
    if (!SAMPLE) throw new Error(T("Reading prescriptions isn't available here. Add the medicines one by one instead.","এখানে প্রেসক্রিপশন পড়ার সুবিধা চালু নেই। একটি একটি করে ঔষধ যোগ করুন।"));
    for (const f of files){
      try {
        const img = await loadImg(f);
        review.imgs.push(scaleTo(img, 900).toDataURL("image/jpeg", 0.72)); render();
        const blob = await new Promise(r => scaleTo(img, 1600).toBlob(r, "image/jpeg", 0.85));
        const out = await SAMPLE.json(RX_PROMPT, {images:[blob], modelTier:"default"});
        for (const x of (out && out.medicines) || []){
          const it = rxToMed(x, pid);
          if (review.items.some(y => y.med.name.trim().toLowerCase() === it.med.name.trim().toLowerCase())) continue;
          review.items.push(it);
        }
      } catch(err){ if (err && ["not_granted","rate_limited"].includes(err.code)) throw err; review.failed++; }
      review.done++; render();
    }
    if (!review.items.length) throw new Error(T("No medicines found. Try clearer, brighter photos.","কোনো ঔষধ পাওয়া যায়নি। আরো পরিষ্কার, আলোতে তোলা ছবি দিন।"));
    review.state = "review";
  } catch(e){
    const msg = e && e.code === "not_granted" ? T("Permission to read the photo was not given.","ছবি পড়ার অনুমতি দেওয়া হয়নি।") : e && e.code === "rate_limited" ? T("Too many tries. Wait a minute.","অনেকবার চেষ্টা হয়েছে। এক মিনিট পরে চেষ্টা করুন।") : (e && (e.message || e.code)) || String(e);
    if (review.items.length){ review.state = "review"; toast(msg); } else review = {state:"error", pid, imgs:review.imgs, msg};
  }
  render();
}

/* ============ Events ============ */
function finishSetup(){
  const p = setup.p;
  if (!p.name) p.name = p.rel === "me" ? "" : relName(p.rel).split(" / ")[0];
  const i = S.profiles.findIndex(x => x.id === p.id);
  if (i >= 0){ S.profiles[i] = p; S.meds.filter(m => m.profile === p.id).forEach(retime); } else S.profiles.push(p);
  save();
}
function saveWiz(){
  const w = wiz, m = w.m;
  m.end = w.days ? dkey(new Date(new Date(m.start + "T00:00").getTime() + (+w.days - 1) * 864e5)) : "";
  if (m.mode !== "sos") m.times.sort((a, b) => toMin(a.t) - toMin(b.t));
  if (w.mode === "review"){
    review.items[w.idx].med = m; review.items[w.idx].unclear = false;
    review.items[w.idx].photo = w.photo || review.items[w.idx].photo; review.items[w.idx].audio = w.audio || review.items[w.idx].audio;
    wiz = null; view = "scan"; render(); window.scrollTo(0, 0); return;
  }
  const i = S.meds.findIndex(x => x.id === m.id);
  if (i >= 0) S.meds[i] = m; else { m.createdAt = Date.now(); S.meds.push(m); }
  ensureNameVoice(m, true);
  if (w.photo) putBlob("photos", m.id, w.photo);
  if (w.audio){ putBlob("audio", m.id, w.audio); try { NAT && NAT.saveClip(m.id, w.audio); } catch(e){} } else if (w.audioRemoved){ dropBlob("audio", m.id); try { NAT && NAT.deleteClip(m.id); } catch(e){} }
  S.setupDone = true; save();
  const pid = m.profile; wiz = null; view = "home"; S.filter = S.profiles.length > 1 ? pid : "all";
  render(); window.scrollTo(0, 0);
  toast(T("Saved. The alarm is set.","সেভ হয়েছে। অ্যালার্ম সেট হয়েছে।"));
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!AC || AC.state !== "running") unlockAudio();
  if (!b || b.disabled) return;
  const a = b.dataset.act, m = wiz && wiz.m;
  switch (a){
    case "go": view = b.dataset.v; wiz = null; if (view !== "scan") review = null; render(); window.scrollTo(0, 0); break;
    case "lang": S.lang = S.lang === "bn" ? "en" : "bn"; save(); render(); break;
    case "setlang": S.lang = b.dataset.l; save(); render(); break;
    case "unlock": unlockAudio(); toast(T("Alarm sound is on","অ্যালার্মের শব্দ চালু হয়েছে")); break;
    case "start": setup = newSetup(true); view = "setup"; render(); break;
    case "filter": S.filter = b.dataset.id; save(); render(); break;
    // person setup
    case "su-rel": { const p = setup.p, oldDefault = relName(p.rel).split(" / ")[0]; p.rel = b.dataset.k; if (!p.name || p.name === oldDefault) p.name = p.rel === "me" ? "" : relName(p.rel).split(" / ")[0]; render(); setTimeout(() => document.getElementById("su-name")?.focus(), 50); break; }
    case "su-dis": { const p = setup.p, k = b.dataset.k; p.diseases = p.diseases.includes(k) ? p.diseases.filter(x => x !== k) : [...p.diseases, k]; render(); break; }
    case "su-dis-add": { const v = document.getElementById("dis-new").value.trim(), p = setup.p; if (v && !p.custom.includes(v)){ p.custom.push(v); p.diseases.push(v); render(); } break; }
    case "su-next":
      if (setup.step === 0 && !setup.p.rel){ toast(T("Choose who it's for","কার জন্য বাছাই করুন")); break; }
      if (setup.step === 0 && setup.p.rel === "me" && !setup.p.name.trim()){ toast(T("Write your name","আপনার নাম লিখুন")); document.getElementById("su-name")?.focus(); break; }
      if (setup.step === 2){ finishSetup(); if (setup.editing){ toast(T("Saved","সেভ হয়েছে")); setup = null; view = "people"; render(); break; } }
      setup.step++; render(); window.scrollTo(0, 0); break;
    case "su-back":
      if (setup.step === 0){ setup = null; view = S.profiles.length ? "people" : "welcome"; } else setup.step--;
      render(); break;
    case "su-later": S.setupDone = true; save(); setup = null; view = "home"; render(); break;
    // add medicine
    case "add": addFor = S.filter !== "all" ? S.filter : (S.profiles[0] || {}).id; view = "add"; render(); break;
    case "add-for": addFor = b.dataset.id; render(); break;
    case "add-for-go": addFor = b.dataset.id; view = "add"; render(); break;
    case "new": setup = null; openWiz(newMed(b.dataset.pid || addFor || S.profiles[0].id), "new"); break;
    case "scan": setup = null; addFor = b.dataset.pid || addFor || S.profiles[0].id; document.getElementById("file-rx").click(); break;
    case "edit": { const x = S.meds.find(y => y.id === b.dataset.id); if (x) openWiz(x, "edit"); break; }
    // wizard
    case "wz-next": if (!wizValidate()) break; if (wiz.step === 1) guessPronunciation(wiz.m); wiz.step++; render(); window.scrollTo(0, 0); break;
    case "wz-back": if (wiz.step === 1){ const back = wiz.mode === "review" ? "scan" : "home"; wiz = null; view = back; } else wiz.step--; render(); window.scrollTo(0, 0); break;
    case "w-goto": wiz.step = +b.dataset.n; render(); window.scrollTo(0, 0); break;
    case "w-cancel": { const back = wiz.mode === "review" ? "scan" : wiz.mode === "edit" ? "meds" : "home"; wiz = null; view = back; render(); break; }
    case "w-form": m.form = b.dataset.k; wiz.formTouched = true; const fs = FORMS[m.form].sites; m.site = fs ? (fs.includes(m.site) ? m.site : fs[0]) : ""; m.times.forEach(x => { if (x.amt < FORMS[m.form].step) x.amt = FORMS[m.form].step; }); render(); break;
    case "w-site": m.site = b.dataset.k; render(); break;
    case "w-mode": setMode(m, b.dataset.k); render(); break;
    case "w-food": m.food = b.dataset.k; m.offset = m.food === "before" ? 30 : 0; retime(m); render(); break;
    case "w-off": m.offset = +b.dataset.n; retime(m); render(); break;
    case "w-slot": { const s = b.dataset.s, i = m.times.findIndex(x => x.slot === s); if (i >= 0) m.times.splice(i, 1); else { m.times.push({slot:s, amt: (m.times[0] || {}).amt || 1, t:"00:00"}); retime(m); } m.times.sort((x, y) => ["b","l","d","bed"].indexOf(x.slot) - ["b","l","d","bed"].indexOf(y.slot)); render(); break; }
    case "w-tadd": m.times.push({t: m.times.length ? fromMin(toMin(m.times[m.times.length - 1].t) + 240) : "08:00", amt: (m.times[0] || {}).amt || 1, custom:true}); render(); break;
    case "w-tdel": m.times.splice(+b.dataset.i, 1); render(); break;
    case "w-every": m.every = +b.dataset.n; m.times = intervalTimes(m); render(); break;
    case "amt-up": case "amt-dn": { const i = +b.dataset.i, st = +b.dataset.s, x = m.times[i]; if (!x) break; x.amt = Math.max(st, Math.round(((+x.amt || 0) + (a === "amt-up" ? st : -st)) * 2) / 2); if (m.mode === "interval" || m.mode === "sos") m.times.forEach(y => y.amt = x.amt); render(); break; }
    case "w-days": wiz.days = b.dataset.n; render(); break;
    case "w-freq": m.freq = b.dataset.k; if (m.freq === "week" && !(m.weekdays || []).length) m.weekdays = [new Date().getDay()]; render(); break;
    case "w-wd": { const i = +b.dataset.i; m.weekdays = (m.weekdays || []).includes(i) ? m.weekdays.filter(x => x !== i) : [...(m.weekdays || []), i]; render(); break; }
    case "say-name": unlockAudio(); if (NAT && !libClip(m)) { try { NAT.makeName(m.id + "_nm", banglaName(m) + "।"); } catch(e){} } speakParts(S.lang === "bn" ? nameParts(m) : [{text: sayName(m) || m.name}]); break;
    case "w-listen": { unlockAudio(); const u = wiz.audio || (!wiz.audioRemoved && A[m.id]); const tmp = {...m, end: wiz.days ? dkey(new Date(new Date(m.start + "T00:00").getTime() + (+wiz.days - 1) * 864e5)) : ""}; const dd = {med:tmp, amt:(m.times[0] || {}).amt || 1}; speakParts(u ? [{audio:u}] : S.lang === "bn" ? [...nameParts(tmp), ...doseClipParts(dd)] : doseLines(dd).map(text => ({text}))); break; }
    case "rec": document.getElementById("file-audio").click(); break;
    case "del-rec": wiz.audio = null; wiz.audioRemoved = true; render(); break;
    case "photo": document.getElementById("file-photo").click(); break;
    case "w-save": {
      if (!m.name.trim()){ wiz.step = 1; render(); toast(T("Write the medicine name","ঔষধের নাম লিখুন")); break; }
      if (m.mode !== "sos" && !m.times.length){ wiz.step = 3; render(); toast(T("Choose at least one time","অন্তত একটি সময় বাছাই করুন")); break; }
      if (rulesFor(m, S.meds).some(x => x[0] === "danger") && !wiz.confirmDanger){ wiz.confirmDanger = true; render(); toast(T("Read the red warning first","আগে লাল সতর্কবার্তাটি পড়ুন")); break; }
      saveWiz(); break;
    }
    case "w-pause": { const x = S.meds.find(y => y.id === m.id); x.paused = !x.paused; save(); wiz = null; view = "meds"; render(); break; }
    case "w-del":
      if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = T("Tap again to delete","মুছতে আবার চাপুন"); break; }
      S.meds = S.meds.filter(x => x.id !== m.id); dropBlob("photos", m.id); dropBlob("audio", m.id); save(); wiz = null; view = "meds"; render(); break;
    // review
    case "rv-edit": { const it = review.items[+b.dataset.i]; openWiz(it.med, "review", +b.dataset.i); wiz.step = 5; wiz.photo = it.photo || null; wiz.audio = it.audio || null; render(); break; }
    case "rv-cancel": review = null; view = "home"; render(); break;
    case "rv-save": {
      const add = review.items.filter(x => x.on && x.med.name.trim());
      add.forEach(x => { const mm = x.med; mm.createdAt = Date.now(); S.meds.push(mm); ensureNameVoice(mm, true); if (x.photo) putBlob("photos", mm.id, x.photo); if (x.audio) putBlob("audio", mm.id, x.audio); });
      S.setupDone = true; save(); review = null; view = "home"; render(); window.scrollTo(0, 0);
      toast(T(`${add.length} medicines saved. Alarms set.`, `${num(add.length)}টি ঔষধ সেভ হয়েছে। অ্যালার্ম সেট হয়েছে।`)); break;
    }
    // today / alarm
    case "take": markDose(b.dataset.id, "taken"); render(); toast(T("Well done!","খুব ভালো!")); break;
    case "sos-take": { const x = S.meds.find(y => y.id === b.dataset.id); S.log[`${dkey(new Date())}|${x.id}|sos|${Date.now()}`] = {s:"taken", at:Date.now()}; if (formOf(x).count && x.stock !== "" && x.stock != null) x.stock = Math.max(0, +x.stock - (+(x.times[0] || {}).amt || 1)); save(); render(); toast(T("Noted","লেখা হয়েছে")); break; }
    case "open-due": { const due = dosesFor(new Date(), S.filter).filter(d => statusOf(d) === "due"); if (due.length) openAlarm(due.filter(d => d.med.profile === due[0].med.profile)); break; }
    case "test": { unlockAudio(); const list = S.meds.filter(x => x.mode !== "sos").slice(0, 3); const t = fromMin(nowMin()); const g = list.length ? list.map(x => ({id:"test|" + x.id, t, amt:(x.times[0] || {}).amt || 1, med:x, test:true})) : [{id:"test|x", t, amt:1, test:true, med:Object.assign(newMed((S.profiles[0] || {}).id), {name:T("Test medicine","পরীক্ষার ঔষধ")})}]; const gg = g.filter(d => d.med.profile === g[0].med.profile); if (NAT){ try { NAT.testAlarm(JSON.stringify(eventFor(gg, new Date(), true))); } catch(err){ openAlarm(gg); } } else openAlarm(gg); break; }
    case "nat-fix": try { NAT.fixSetting(b.dataset.k); } catch(err){} break;
    case "nat-tts": try { NAT.openTtsSettings(); } catch(err){} break;
    case "vc-install": try { NAT.openTtsInstall(); } catch(err){} break;
    case "vc-data": try { NAT.installTtsData(); } catch(err){} break;
    case "vc-test": unlockAudio(); speakParts(S.lang === "bn" ? [{c:"test"}, ...SAMPLE_BN] : [{text:"Hello. It is medicine time. Seclo, one capsule, before food."}]); break;
    case "al-taken": alarmGroup.forEach(d => { if (!d.test) markDose(d.id, "taken"); }); closeAlarm(); toast(T("Well done!","খুব ভালো!")); break;
    case "al-skip": alarmGroup.forEach(d => { if (!d.test) markDose(d.id, "skipped"); }); closeAlarm(); break;
    case "al-snooze": alarmGroup.forEach(d => { snooze[d.id] = Date.now() + 10*60000; }); closeAlarm(); toast(T("I'll remind you in 10 minutes","১০ মিনিট পরে আবার মনে করিয়ে দেব")); break;
    case "al-speak": speakParts(alarmParts(alarmGroup, gastricFirst(alarmGroup))); break;
    case "al-first": markDose(b.dataset.id, "taken"); b.textContent = T("Gastric medicine taken ✓","গ্যাস্ট্রিকের ঔষধ নেওয়া হয়েছে ✓"); b.disabled = true; break;
    case "big-on": S.bigMode = true; view = "home"; save(); render(); break;
    case "big-off": S.bigMode = false; save(); render(); break;
    case "big-speak": { const due = dosesFor(new Date()).filter(d => statusOf(d) === "due"); if (due.length){ const g = due.filter(d => d.med.profile === due[0].med.profile); speakParts(alarmParts(g, gastricFirst(g))); } break; }
    // people
    case "p-new": setup = newSetup(false); view = "setup"; render(); break;
    case "p-edit": setup = newSetup(false, prof(b.dataset.id)); view = "setup"; render(); break;
    case "p-del":
      if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = T("Tap again: removes their medicines too","আবার চাপুন: ওনার ঔষধও মুছে যাবে"); break; }
      S.meds.filter(x => x.profile === b.dataset.id).forEach(x => { dropBlob("photos", x.id); dropBlob("audio", x.id); });
      S.meds = S.meds.filter(x => x.profile !== b.dataset.id); S.profiles = S.profiles.filter(p => p.id !== b.dataset.id); S.filter = "all"; save(); render(); break;
    // settings
    case "test-voice": unlockAudio(); speakParts(S.lang === "bn" ? SAMPLE_BN : [{text:"It is medicine time."},{text:"Two medicines now."},{text:"Number one: Seclo. One capsule, 30 minutes before food."}]); break;
    case "example": loadExample(); break;
    case "reset":
      if (b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = T("Tap again: this deletes everything","আবার চাপুন: সব মুছে যাবে"); break; }
      Object.keys(P).forEach(k => dropBlob("photos", k)); Object.keys(A).forEach(k => dropBlob("audio", k));
      S = Object.assign(structuredClone(DEFAULT), {lang:S.lang}); view = "welcome"; setup = null; save(); render(); break;
  }
});
document.addEventListener("input", e => {
  const el = e.target, id = el.id || "";
  if (view === "setup" && setup){
    if (id === "su-name") setup.p.name = el.value;
    else if (id.startsWith("su-meal-") && el.value) setup.p.meals[id.slice(8)] = el.value;
  }
  if (view === "wiz" && wiz){
    const m = wiz.m;
    if (id === "w-name"){ m.name = el.value; if (!wiz.catTouched) m.cat = detectCat(el.value); if (!wiz.formTouched){ const f = detectForm(el.value); if (f){ m.form = f; const fs = FORMS[f].sites; m.site = fs ? fs[0] : ""; } } }
    else if (id === "w-namebn") m.name_bn = el.value;
    else if (id === "w-cat"){ m.cat = el.value; wiz.catTouched = true; }
    else if (id === "w-sitetext") m.siteText = el.value;
    else if (id === "w-daysn") wiz.days = el.value;
    else if (id === "w-start") m.start = el.value || dkey(new Date());
    else if (id === "w-stock") m.stock = el.value;
    else if (id === "w-note") m.note = el.value;
    else if (id === "w-sosmax") m.sosMax = el.value;
    else if (id === "w-first" && el.value){ m.first = el.value; m.times = intervalTimes(m); }
    else if (id.startsWith("tm-") && el.value){ const x = m.times[+el.dataset.i]; x.t = el.value; x.custom = true; }
    else if (id.startsWith("amt-") && +el.value > 0){ const x = m.times[+el.dataset.i]; x.amt = +el.value; if (m.mode === "interval" || m.mode === "sos") m.times.forEach(y => y.amt = x.amt); }
  }
  if (view === "settings"){
    if (id === "s-rate"){ S.voice.rate = +el.value; save(); }
  }
});
document.addEventListener("change", e => {
  const el = e.target, id = el.id || "";
  if (view === "wiz" && wiz && (id === "w-daysn" || id === "w-start" || id === "w-first")) render();
  if (view === "settings" && id === "s-voice"){ S.voice.name = el.value; save(); }
  if (view === "scan" && review && el.dataset.rvon != null){ review.items[+el.dataset.rvon].on = el.checked; render(); }
});
document.getElementById("file-photo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !wiz) return;
  try { const img = await loadImg(f); wiz.photo = scaleTo(img, 220).toDataURL("image/jpeg", 0.72); render(); } catch(err){ toast(T("Couldn't open that photo","ছবিটি খোলা যায়নি")); }
});
document.getElementById("file-rx").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) scanFiles(fs, addFor || S.profiles[0].id); });
document.getElementById("file-audio").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !wiz) return;
  if (f.size > 900000){ toast(T("Too long. Keep it under 20 seconds.","অনেক লম্বা। ২০ সেকেন্ডের কম রাখুন।")); return; }
  const r = new FileReader(); r.onload = () => { wiz.audio = r.result; wiz.audioRemoved = false; render(); toast(T("Voice added","কণ্ঠ যোগ হয়েছে")); }; r.readAsDataURL(f);
});

/* ============ Boot ============ */
loadLocal();
view = S.setupDone ? "home" : (S.profiles.length ? "setup" : "welcome");
if (view === "setup") setup = Object.assign(newSetup(true), {step:3, p:S.profiles[0]});
render();
setInterval(() => { checkAlarms(); if (!alarmGroup && view === "home" && !document.activeElement?.matches("input,select")) render(); }, 15000);
setTimeout(checkAlarms, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkAlarms(); });
try { speechSynthesis.onvoiceschanged = () => { if (view === "settings") render(); }; } catch(e){}
if (NAT){ try { Object.entries(A).forEach(([k, u]) => NAT.saveClip(k, u)); } catch(e){} window.onNativeResume(); }
(async () => {
  await initCloud();
  try { TTS = window.claude ? await claude.use("tts") : null; } catch(e){ TTS = null; }
  try { if (!SAMPLE && window.claude) SAMPLE = await claude.use("sample"); } catch(e){}
})();
</script>
